name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its running checks; runs on main are left to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The oldest and newest Elixir/OTP pairs intellij-elixir builds the quoter with (its .github/ci-versions.json).
# Steps read them as env; the matrix cannot read env, so it uses the YAML anchors instead.
env:
  MIN_ELIXIR: &min-elixir '1.11.4'
  MIN_OTP: &min-otp '24.3.4.6'
  MAX_ELIXIR: &max-elixir '1.20.4'
  MAX_OTP: &max-otp '29.0.6'

jobs:
  # Formatting, Credo and Dialyzer results vary between Elixir versions, so they are checked once, on the
  # newest. Credo does not run on Elixir < 1.13.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Erlang & Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.MAX_OTP }}
          elixir-version: ${{ env.MAX_ELIXIR }}

      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ github.job }}-${{ runner.os }}-${{ env.MAX_ELIXIR }}-otp-${{ env.MAX_OTP }}-${{ hashFiles('mix.exs', 'mix.lock') }}
          restore-keys: |
            mix-${{ github.job }}-${{ runner.os }}-${{ env.MAX_ELIXIR }}-otp-${{ env.MAX_OTP }}-

      - name: Restore PLT cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ env.MAX_ELIXIR }}-otp-${{ env.MAX_OTP }}-${{ hashFiles('mix.exs', 'mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ env.MAX_ELIXIR }}-otp-${{ env.MAX_OTP }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      # --force here and below: a restored _build is up to date, so without it nothing recompiles and no
      # warnings are emitted to fail on.
      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors --force

      - name: Check formatting
        run: mix format --check-formatted

      - name: Credo
        run: mix credo --strict

      - name: Dialyzer
        run: mix dialyzer

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The oldest pair on Linux and the newest on every OS; intellij-elixir's CI covers the versions between.
        include:
          - elixir: *min-elixir
            otp: *min-otp
            os: ubuntu-24.04
          - elixir: *max-elixir
            otp: *max-otp
            os: ubuntu-24.04
          - elixir: *max-elixir
            otp: *max-otp
            os: windows-2022
          - elixir: *max-elixir
            otp: *max-otp
            os: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Erlang & Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ github.job }}-${{ runner.os }}-${{ matrix.elixir }}-otp-${{ matrix.otp }}-${{ hashFiles('mix.exs', 'mix.lock') }}
          restore-keys: |
            mix-${{ github.job }}-${{ runner.os }}-${{ matrix.elixir }}-otp-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      # A compile step rather than `mix test --warnings-as-errors`, which Elixir 1.11 does not have.
      - name: Compile tests (warnings as errors)
        env:
          MIX_ENV: test
        run: mix compile --warnings-as-errors --force

      - name: Run tests
        run: mix test

      # intellij-elixir builds the quoter under MIX_ENV=prod (DEFAULT_MIX_ENV in buildSrc/.../MixEnvironment.kt).
      - name: Compile release (warnings as errors)
        env:
          MIX_ENV: prod
        run: mix compile --warnings-as-errors --force

      - name: Build release
        env:
          MIX_ENV: prod
        run: mix release --overwrite

      - name: Smoke test release
        shell: bash
        env:
          MIX_ENV: prod
        run: .github/scripts/smoke-test-release.sh
